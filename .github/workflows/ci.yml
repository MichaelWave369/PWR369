name: Validate model
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: npm run check
      - name: Model unit tests
        run: npm test
      - name: Export smoke test
        run: node scripts/export-run.mjs --seconds=5 --out=/tmp/pwr369-test.csv && test -s /tmp/pwr369-test.csv
